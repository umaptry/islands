# CI/CD: test → deploy candidate → verify → promote to 100% traffic.
#
# PR to main:   python-test only.
# Push to main:  python-test → deploy → verify-and-promote.
# Manual:       workflow_dispatch with optional skip flags.
#
# Repository variables required for deployment:
#   DEPLOY_ENABLED=true, GCP_PROJECT_ID, GCP_WORKLOAD_IDENTITY_PROVIDER,
#   GCP_SERVICE_ACCOUNT, CLOUD_RUN_RUNTIME_SERVICE_ACCOUNT,
#   CLOUD_RUN_REGION (default: asia-northeast1), SUPABASE_URL,
#   SUPABASE_ANON_KEY, SUPABASE_SERVICE_KEY_VERSION (default: 1)
#   KOTOBA_MAP_URL is used by the manual keepalive workflow.
name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

env:
  PYTHON_VERSION: "3.12"
  CLOUD_RUN_SERVICE: islands
  CLOUD_RUN_REGION: ${{ vars.CLOUD_RUN_REGION || 'asia-northeast1' }}
  HF_REVISION: "614241f622f53c4eeff9890bdc4f31cfecc418b3"

jobs:
  # ------------------------------------------------------------------
  # 1. Python tests (runs on every push and PR)
  # ------------------------------------------------------------------
  python-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      KOTOBA_DISABLE_RATE_LIMIT: "1"
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Cache HuggingFace model
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: ~/.cache/huggingface/hub/models--intfloat--multilingual-e5-small
          key: hf-e5-small-${{ env.HF_REVISION }}

      - name: Install dependencies
        run: pip install -r requirements-test.txt

      - name: Run tests
        run: python -m pytest tests/ -v --tb=short

  # ------------------------------------------------------------------
  # 2. Build and deploy candidate (main only, after tests pass)
  # ------------------------------------------------------------------
  deploy:
    if: >-
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main' &&
      vars.DEPLOY_ENABLED == 'true'
    needs: [python-test]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production
    permissions:
      contents: read
      id-token: write
    env:
      CLOUD_RUN_RUNTIME_SERVICE_ACCOUNT: ${{ vars.CLOUD_RUN_RUNTIME_SERVICE_ACCOUNT }}
      SUPABASE_URL: ${{ vars.SUPABASE_URL }}
      SUPABASE_ANON_KEY: ${{ vars.SUPABASE_ANON_KEY }}
      SUPABASE_SERVICE_KEY_VERSION: ${{ vars.SUPABASE_SERVICE_KEY_VERSION || '1' }}
    outputs:
      candidate_url: ${{ steps.deploy.outputs.candidate_url }}
      revision: ${{ steps.deploy.outputs.revision }}
      image: ${{ steps.build.outputs.image }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Validate deployment configuration
        env:
          GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
          GCP_WORKLOAD_IDENTITY_PROVIDER: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          GCP_SERVICE_ACCOUNT: ${{ vars.GCP_SERVICE_ACCOUNT }}
        run: |
          missing=()
          for name in \
            GCP_PROJECT_ID \
            GCP_WORKLOAD_IDENTITY_PROVIDER \
            GCP_SERVICE_ACCOUNT \
            CLOUD_RUN_RUNTIME_SERVICE_ACCOUNT \
            SUPABASE_URL \
            SUPABASE_ANON_KEY \
            SUPABASE_SERVICE_KEY_VERSION; do
            if [ -z "${!name}" ]; then
              missing+=("$name")
            fi
          done
          if [ "${#missing[@]}" -ne 0 ]; then
            echo "::error::Missing repository variables: ${missing[*]}"
            exit 1
          fi

      - id: auth
        uses: google-github-actions/auth@ba79af03959ebeac9769e648f473a284504d9193 # v2.1.10
        with:
          project_id: ${{ vars.GCP_PROJECT_ID }}
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}

      - uses: google-github-actions/setup-gcloud@77e7a554d41e2ee56fc945c52dfd3f33d12def9a # v2.1.4

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker ${{ env.CLOUD_RUN_REGION }}-docker.pkg.dev --quiet

      - name: Build and push image
        id: build
        run: |
          IMAGE="${{ env.CLOUD_RUN_REGION }}-docker.pkg.dev/${{ vars.GCP_PROJECT_ID }}/cloud-run-source-deploy/${{ env.CLOUD_RUN_SERVICE }}:${{ github.sha }}"
          docker build -t "$IMAGE" .
          docker push "$IMAGE"
          echo "image=$IMAGE" >> "$GITHUB_OUTPUT"

      - name: Deploy candidate revision (0% traffic)
        id: deploy
        run: |
          # Cloud Run rejects --no-traffic while creating a service. The first
          # healthy revision therefore creates the service normally; every
          # later deploy remains isolated at 0% until verification succeeds.
          TRAFFIC_ARGS=(--no-traffic)
          if ! gcloud run services describe ${{ env.CLOUD_RUN_SERVICE }} \
            --project "${{ vars.GCP_PROJECT_ID }}" \
            --region ${{ env.CLOUD_RUN_REGION }} >/dev/null 2>&1; then
            TRAFFIC_ARGS=()
            echo "Cloud Run service does not exist yet; creating the initial revision"
          fi

          gcloud run deploy ${{ env.CLOUD_RUN_SERVICE }} \
            --image "${{ steps.build.outputs.image }}" \
            --project "${{ vars.GCP_PROJECT_ID }}" \
            --region ${{ env.CLOUD_RUN_REGION }} \
            "${TRAFFIC_ARGS[@]}" \
            --tag candidate \
            --service-account "$CLOUD_RUN_RUNTIME_SERVICE_ACCOUNT" \
            --memory 2Gi --cpu 1 \
            --max-instances 4 --concurrency 12 \
            --timeout 120 --cpu-boost \
            --allow-unauthenticated \
            --set-env-vars "^##^SUPABASE_URL=${SUPABASE_URL}##SUPABASE_ANON_KEY=${SUPABASE_ANON_KEY}" \
            --set-secrets "SUPABASE_SERVICE_KEY=supabase-service-key:${SUPABASE_SERVICE_KEY_VERSION}" \
            --format json > /tmp/deploy.json

          CANDIDATE_URL=$(gcloud run services describe ${{ env.CLOUD_RUN_SERVICE }} \
            --project "${{ vars.GCP_PROJECT_ID }}" \
            --region ${{ env.CLOUD_RUN_REGION }} --format=json \
            | jq -r '.status.traffic[]? | select(.tag == "candidate") | .url' \
            | head -n 1)
          if [ -z "$CANDIDATE_URL" ]; then
            echo "::error::Candidate tag URL was not returned by Cloud Run"
            exit 1
          fi
          REVISION=$(jq -r '.status.latestCreatedRevisionName // empty' /tmp/deploy.json)

          echo "candidate_url=$CANDIDATE_URL" >> "$GITHUB_OUTPUT"
          echo "revision=$REVISION" >> "$GITHUB_OUTPUT"
          echo "Candidate deployed: $CANDIDATE_URL"

  # ------------------------------------------------------------------
  # 3. Verify candidate and promote to 100% traffic
  # ------------------------------------------------------------------
  verify-and-promote:
    if: >-
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main' &&
      vars.DEPLOY_ENABLED == 'true'
    needs: [deploy]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    env:
      EXPECTED_SUPABASE_URL: ${{ vars.SUPABASE_URL }}
    steps:
      - id: auth
        uses: google-github-actions/auth@ba79af03959ebeac9769e648f473a284504d9193 # v2.1.10
        with:
          project_id: ${{ vars.GCP_PROJECT_ID }}
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}

      - uses: google-github-actions/setup-gcloud@77e7a554d41e2ee56fc945c52dfd3f33d12def9a # v2.1.4

      - name: Verify candidate health
        run: |
          CANDIDATE_URL="${{ needs.deploy.outputs.candidate_url }}"
          echo "Verifying: $CANDIDATE_URL/api/health"

          for i in 1 2 3 4 5; do
            RESPONSE=$(curl --fail --silent --max-time 120 "$CANDIDATE_URL/api/health" 2>/dev/null) && break
            echo "Attempt $i failed, retrying in 15s..."
            sleep 15
          done

          if [ -z "$RESPONSE" ]; then
            echo "::error::Health endpoint unreachable after 5 attempts"
            exit 1
          fi

          echo "$RESPONSE" | python3 -c "
          import json, sys
          h = json.load(sys.stdin)
          errors = []
          if h.get('store') != 'supabase':
              errors.append(f\"store={h.get('store')}, expected supabase\")
          if not h.get('store_ok'):
              errors.append('store_ok is false — DB connection failed')
          if errors:
              for e in errors: print(f'::error::{e}')
              sys.exit(1)
          print(f\"Health OK: store={h['store']}, store_ok={h['store_ok']}, posts={h.get('posts', '?')}\")
          "

      - name: Verify browser Supabase configuration
        run: |
          CANDIDATE_URL="${{ needs.deploy.outputs.candidate_url }}"
          CONFIG=$(curl --fail --silent --max-time 30 "$CANDIDATE_URL/api/config")
          echo "$CONFIG" | python3 -c "
          import json, os, sys
          config = json.load(sys.stdin)
          supabase = config.get('supabase') or {}
          errors = []
          if config.get('mode') != 'supabase':
              errors.append(f\"mode={config.get('mode')}, expected supabase\")
          if supabase.get('url') != os.environ['EXPECTED_SUPABASE_URL']:
              errors.append('Supabase URL does not match the repository variable')
          if not supabase.get('anon_key'):
              errors.append('Supabase anon key is empty')
          if errors:
              for error in errors: print(f'::error::{error}')
              sys.exit(1)
          print('Browser Supabase configuration OK')
          "

      - name: Verify static assets
        run: |
          CANDIDATE_URL="${{ needs.deploy.outputs.candidate_url }}"
          for path in "/" "/how" "/static/style.css" "/static/js/app.js"; do
            STATUS=$(curl -o /dev/null -s -w "%{http_code}" --max-time 30 "$CANDIDATE_URL$path")
            if [ "$STATUS" != "200" ]; then
              echo "::error::$path returned $STATUS"
              exit 1
            fi
            echo "$path: $STATUS OK"
          done

      - name: Promote candidate to 100% traffic
        run: |
          gcloud run services update-traffic ${{ env.CLOUD_RUN_SERVICE }} \
            --project "${{ vars.GCP_PROJECT_ID }}" \
            --region ${{ env.CLOUD_RUN_REGION }} \
            --to-tags candidate=100
          echo "Traffic shifted to candidate revision"

      - name: Record release info
        run: |
          echo "## Release Summary" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Revision**: ${{ needs.deploy.outputs.revision }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Image**: ${{ needs.deploy.outputs.image }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Commit**: ${{ github.sha }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Promoted at**: $(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_STEP_SUMMARY"

  # ------------------------------------------------------------------
  # 4. Clean up old Artifact Registry images
  # ------------------------------------------------------------------
  cleanup:
    if: >-
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main' &&
      vars.DEPLOY_ENABLED == 'true'
    needs: [verify-and-promote]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      id-token: write
    steps:
      - id: auth
        uses: google-github-actions/auth@ba79af03959ebeac9769e648f473a284504d9193 # v2.1.10
        with:
          project_id: ${{ vars.GCP_PROJECT_ID }}
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}

      - uses: google-github-actions/setup-gcloud@77e7a554d41e2ee56fc945c52dfd3f33d12def9a # v2.1.4

      - name: Keep two releases and remove older images after 14 days
        run: |
          REPO="${{ env.CLOUD_RUN_REGION }}-docker.pkg.dev/${{ vars.GCP_PROJECT_ID }}/cloud-run-source-deploy/${{ env.CLOUD_RUN_SERVICE }}"
          gcloud artifacts docker images list "$REPO" \
            --project "${{ vars.GCP_PROJECT_ID }}" \
            --include-tags --format=json \
            | python3 -c "
          import json, sys
          from datetime import datetime, timedelta, timezone
          cutoff = datetime.now(timezone.utc) - timedelta(days=14)
          images = sorted(
              json.load(sys.stdin),
              key=lambda img: img.get('createTime', ''),
              reverse=True,
          )
          # Keep the two newest release images even after the age cutoff so a
          # known-good revision remains available for rollback.
          for img in images[2:]:
              created = img.get('createTime', '')
              if not created:
                  continue
              ts = datetime.fromisoformat(created.replace('Z', '+00:00'))
              if ts < cutoff:
                  digest = img['version'].split('/')[-1]
                  uri = f\"$REPO@{digest}\"
                  print(f'Deleting {uri} (created {created})')
                  import subprocess
                  subprocess.run(['gcloud', 'artifacts', 'docker', 'images', 'delete', uri, '--quiet', '--delete-tags'], check=False)
          " || echo "Cleanup: no images to remove or cleanup failed (non-fatal)"
