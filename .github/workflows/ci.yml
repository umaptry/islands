name: ci
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      action:
        type: choice
        options: [test, audit, release, migration-candidate]
        default: test
      provider:
        type: choice
        options: [onnx, gemini]
        default: onnx
      artifact_version:
        type: string
        default: kotoba-map-v1
      artifact_uri:
        description: 'Gemini: private gs://bucket/object.zip#generation'
        type: string
      artifact_sha256:
        description: 'Gemini: SHA-256 of the release archive'
        type: string
concurrency:
  group: deploy-production
  cancel-in-progress: false
permissions:
  contents: read
env:
  PYTHON_VERSION: '3.12'
  CLOUD_RUN_SERVICE: islands
  CLOUD_RUN_REGION: asia-northeast1
  GCP_PROJECT_ID: gen-lang-client-0999045451
jobs:
  audit:
    if: github.event_name == 'workflow_dispatch' && inputs.action == 'audit' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: google-github-actions/auth@ba79af03959ebeac9769e648f473a284504d9193
        with:
          project_id: ${{ env.GCP_PROJECT_ID }}
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}
      - uses: google-github-actions/setup-gcloud@77e7a554d41e2ee56fc945c52dfd3f33d12def9a
      - name: Read service identity and health without secrets
        run: |
          set -euo pipefail
          gcloud run services describe islands --project "$GCP_PROJECT_ID" --region "$CLOUD_RUN_REGION" --format=json > /tmp/service.json
          python3 - <<'PY'
          import json, urllib.request
          d=json.load(open('/tmp/service.json'))
          s=d['spec']['template']['spec']
          print(json.dumps({'url': d['status']['url'], 'traffic':d['status']['traffic'], 'service_account':s.get('serviceAccountName'), 'containers':[{'image':c['image'], 'resources':c.get('resources'), 'secret_refs':[{'name':e['name'],'ref':e['valueFrom']} for e in c.get('env',[]) if 'valueFrom' in e]} for c in s['containers']]}, indent=2))
          for path in ['/api/health']:
              with urllib.request.urlopen(d['status']['url']+path, timeout=120) as r:
                  print(r.read().decode())
          PY
      - name: Read IAM, enabled APIs and secret version metadata
        run: |
          gcloud projects get-iam-policy "$GCP_PROJECT_ID" --format=json || true
          gcloud services list --enabled --project "$GCP_PROJECT_ID" --format='value(config.name)' || true
          for secret in supabase-service-key GEMINI_API_KEY; do
            gcloud secrets versions list "$secret" --project "$GCP_PROJECT_ID" --format='table(name,state,createTime)' || true
          done
  frontend-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test tests/frontend/*.test.mjs
  image-test:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - run: docker build --target onnx -t islands-e5-check .
      - name: Verify offline E5 container
        run: |
          docker run --rm --network none islands-e5-check python -c "from core.embedder import load_embedder; from core.artifact_manifest import validate_manifest; validate_manifest('/app/artifacts','onnx'); assert load_embedder(provider='onnx').encode(['offline smoke']).shape == (1,384)"
          docker image inspect islands-e5-check --format='E5 image bytes: {{.Size}}' >> "$GITHUB_STEP_SUMMARY"
  python-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      EMBEDDING_PROVIDER: onnx
      KOTOBA_DISABLE_RATE_LIMIT: '1'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: pip install -r requirements-test.txt
      - run: python -m pytest tests/ -v --tb=short
  browser-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: pip install -r requirements-test.txt
      - run: npm install --no-save @playwright/test@1.55.0
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-verification
          path: |
            output/browser-tests/
            output/playwright-report/
  database-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npx --yes supabase@2.39.2 start
      - run: npx --yes supabase@2.39.2 test db
      - if: always()
        run: npx --yes supabase@2.39.2 stop --no-backup
  deploy:
    if: >-
      github.ref == 'refs/heads/main' &&
      ((github.event_name == 'push' && vars.DEPLOY_ENABLED == 'true') ||
       (github.event_name == 'workflow_dispatch' &&
        (inputs.action == 'migration-candidate' ||
         (inputs.action == 'release' && vars.DEPLOY_ENABLED == 'true'))))
    needs: [frontend-test, python-test, browser-test, database-test, image-test]
    runs-on: ubuntu-latest
    timeout-minutes: 40
    environment: production
    permissions:
      contents: read
      id-token: write
    env:
      PROVIDER: ${{ github.event_name == 'workflow_dispatch' && inputs.provider || vars.EMBEDDING_PROVIDER || 'onnx' }}
      MAP_VERSION: ${{ github.event_name == 'workflow_dispatch' && inputs.artifact_version || vars.MAP_ARTIFACT_VERSION || 'kotoba-map-v1' }}
      MAP_URI: ${{ github.event_name == 'workflow_dispatch' && inputs.artifact_uri || vars.MAP_ARTIFACT_URI }}
      MAP_SHA256: ${{ github.event_name == 'workflow_dispatch' && inputs.artifact_sha256 || vars.MAP_ARTIFACT_SHA256 }}
      RUNTIME_SA: ${{ vars.CLOUD_RUN_RUNTIME_SERVICE_ACCOUNT }}
      SUPABASE_URL: ${{ vars.SUPABASE_URL }}
      SUPABASE_ANON_KEY: ${{ vars.SUPABASE_ANON_KEY }}
      SUPABASE_SECRET_VERSION: ${{ vars.SUPABASE_SERVICE_KEY_VERSION }}
      GEMINI_SECRET_VERSION: ${{ vars.GEMINI_API_KEY_VERSION }}
      RELEASE_ACTION: ${{ inputs.action || 'release' }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - name: Validate target and release selection
        run: |
          set -euo pipefail
          test "$SUPABASE_URL" = 'https://soznrzkhvktzxlslpphm.supabase.co'
          test -n "$SUPABASE_ANON_KEY"
          test -n "$RUNTIME_SA"
          [[ "$SUPABASE_SECRET_VERSION" =~ ^[1-9][0-9]*$ ]]
          [[ "$MAP_VERSION" =~ ^[a-zA-Z0-9][a-zA-Z0-9._-]*$ ]]
          case "$PROVIDER" in
            onnx) test "$MAP_VERSION" = kotoba-map-v1 ;;
            gemini)
              [[ "$GEMINI_SECRET_VERSION" =~ ^[1-9][0-9]*$ ]]
              [[ "$MAP_URI" =~ ^gs://[^/]+/.+#[0-9]+$ ]]
              [[ "$MAP_SHA256" =~ ^[a-f0-9]{64}$ ]] ;;
            *) exit 1 ;;
          esac
      - uses: google-github-actions/auth@ba79af03959ebeac9769e648f473a284504d9193
        with:
          project_id: ${{ env.GCP_PROJECT_ID }}
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}
      - uses: google-github-actions/setup-gcloud@77e7a554d41e2ee56fc945c52dfd3f33d12def9a
      - name: Require existing service and preserve rollback identity
        run: |
          set -euo pipefail
          gcloud run services describe "$CLOUD_RUN_SERVICE" --project "$GCP_PROJECT_ID" --region "$CLOUD_RUN_REGION" --format=json > /tmp/before.json
          python -c 'import json; d=json.load(open("/tmp/before.json")); print("Previous traffic:", d["status"]["traffic"])' >> "$GITHUB_STEP_SUMMARY"
      - name: Fetch and verify immutable map
        run: |
          set -euo pipefail
          if [ "$PROVIDER" = gemini ]; then
            gcloud storage cp "$MAP_URI" /tmp/map.zip
            python scripts/artifact_release.py unpack --source /tmp/map.zip --output .release-artifacts --provider "$PROVIDER" --version "$MAP_VERSION" --sha256 "$MAP_SHA256"
          else
            python scripts/artifact_release.py check --source artifacts --provider "$PROVIDER" --version "$MAP_VERSION"
          fi
      - name: Build, push and deploy isolated candidate
        run: |
          set -euo pipefail
          REPO="$CLOUD_RUN_REGION-docker.pkg.dev/$GCP_PROJECT_ID/cloud-run-source-deploy/islands"
          TAG="$REPO:$GITHUB_SHA-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          gcloud auth configure-docker "$CLOUD_RUN_REGION-docker.pkg.dev" --quiet
          docker build --target "$PROVIDER" -t "$TAG" .
          docker image inspect "$TAG" --format='Image bytes: {{.Size}}' >> "$GITHUB_STEP_SUMMARY"
          docker push "$TAG"
          DIGEST=$(gcloud artifacts docker images describe "$TAG" --project "$GCP_PROJECT_ID" --format='value(image_summary.digest)')
          [[ "$DIGEST" =~ ^sha256:[a-f0-9]{64}$ ]]
          IMAGE="$REPO@$DIGEST"
          SECRETS="SUPABASE_SERVICE_KEY=supabase-service-key:$SUPABASE_SECRET_VERSION"
          if [ "$PROVIDER" = gemini ]; then
            SECRETS="$SECRETS,GEMINI_API_KEY=GEMINI_API_KEY:$GEMINI_SECRET_VERSION"
          fi
          gcloud run deploy "$CLOUD_RUN_SERVICE" --project "$GCP_PROJECT_ID" --region "$CLOUD_RUN_REGION" \
            --image "$IMAGE" --no-traffic --tag "candidate-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" \
            --service-account "$RUNTIME_SA" --memory 2Gi --cpu 1 --max-instances 4 --concurrency 12 --timeout 120 --cpu-boost \
            --update-env-vars "^##^SUPABASE_URL=$SUPABASE_URL##SUPABASE_ANON_KEY=$SUPABASE_ANON_KEY##EMBEDDING_PROVIDER=$PROVIDER##MAP_RUNTIME_CHECK=1##MAP_ARTIFACTS_DIR=/app/artifacts" \
            --update-secrets "$SECRETS" --format=json > /tmp/deploy.json
          REVISION=$(jq -r '.status.latestCreatedRevisionName' /tmp/deploy.json)
          gcloud run services describe "$CLOUD_RUN_SERVICE" --project "$GCP_PROJECT_ID" --region "$CLOUD_RUN_REGION" --format=json > /tmp/service.json
          CANDIDATE_URL=$(jq -r --arg tag "candidate-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" '.status.traffic[] | select(.tag == $tag) | .url' /tmp/service.json)
          test -n "$CANDIDATE_URL"
          echo "REVISION=$REVISION" >> "$GITHUB_ENV"
          echo "CANDIDATE_URL=$CANDIDATE_URL" >> "$GITHUB_ENV"
          echo "Release: $PROVIDER / $MAP_VERSION / $IMAGE / $REVISION / $CANDIDATE_URL" >> "$GITHUB_STEP_SUMMARY"
      - name: Verify candidate
        run: |
          set -euo pipefail
          PHASE=ready
          if [ "$RELEASE_ACTION" = migration-candidate ]; then PHASE=pre-migration; fi
          python scripts/verify_release.py --url "$CANDIDATE_URL" --provider "$PROVIDER" --version "$MAP_VERSION" --supabase-url "$SUPABASE_URL" --phase "$PHASE"
      - name: Promote only a ready normal release
        if: env.RELEASE_ACTION == 'release'
        run: |
          set -euo pipefail
          python scripts/verify_release.py --url "$CANDIDATE_URL" --provider "$PROVIDER" --version "$MAP_VERSION" --supabase-url "$SUPABASE_URL" --phase ready
          gcloud run services update-traffic "$CLOUD_RUN_SERVICE" --project "$GCP_PROJECT_ID" --region "$CLOUD_RUN_REGION" --to-revisions "$REVISION=100"
      - name: Record retention requirement
        run: |
          echo 'No automatic image deletion. Preserve E5 rollback image/artifacts for at least 30 days; inventory islands-only cleanup after 24h observation.' >> "$GITHUB_STEP_SUMMARY"
