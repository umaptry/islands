# Manual health check. The scheduled cron has been removed in favour of
# Cloud Monitoring Uptime Checks, which double as keepalive pings (they hit
# /api/health every 5 minutes). This avoids:
#   - duplicate pings (Monitoring + GitHub cron)
#   - Actions minutes consumption on private repos
#   - GitHub auto-disabling the schedule after 60 days of no commits
#
# Keep this workflow for on-demand diagnosis:
#   gh workflow run keepalive
name: keepalive

on:
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping /api/health
        env:
          URL: ${{ vars.KOTOBA_MAP_URL }}
        run: |
          if [ -z "$URL" ]; then
            echo "Set the repository variable KOTOBA_MAP_URL to the Cloud Run URL." >&2
            exit 1
          fi
          curl --fail --silent --show-error --max-time 120 "$URL/api/health"
