<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light">
<meta name="theme-color" content="#fdfcfa">
<title>かさなり</title>
<link rel="stylesheet" href="/static/style.css">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><circle cx='13' cy='16' r='8' fill='%23ea580c' opacity='.75'/><circle cx='19' cy='16' r='8' fill='%230e7490' opacity='.75'/></svg>">
</head>
<body>

<!-- ============ 0. booting ============
     Shown first so a returning visitor never sees the intro flash past while
     their profile is being fetched. app.js picks the real first screen. -->
<section id="booting" class="screen active">
  <div class="spinner" role="status" aria-label="読み込み中"></div>
</section>

<!-- ============ 1. intro ============ -->
<section id="intro" class="screen">
  <div class="brand">かさなり</div>
  <div class="slides">
    <div class="slide-track" id="slideTrack">
      <div class="slide">
        <svg class="slide-art" viewBox="0 0 200 200" role="img" aria-label="中心の点のまわりを他の点が囲む図">
          <g fill="none" stroke="#ded7cd" stroke-dasharray="3 5">
            <circle cx="100" cy="100" r="42"/><circle cx="100" cy="100" r="66"/><circle cx="100" cy="100" r="90"/>
          </g>
          <circle cx="100" cy="100" r="17" fill="#ea580c"/>
          <circle cx="138" cy="82" r="9" fill="#0284c7"/>
          <circle cx="72" cy="140" r="9" fill="#7c3aed"/>
          <circle cx="46" cy="72" r="8" fill="#059669"/>
          <circle cx="160" cy="140" r="7" fill="#db2777"/>
          <circle cx="100" cy="18" r="6" fill="#b45309"/>
        </svg>
        <h2>書いた一言で、<br>地図の上に居場所ができる</h2>
        <p>年齢も性別も居場所も使いません。</p>
      </div>
      <div class="slide">
        <svg class="slide-art" viewBox="0 0 200 200" role="img" aria-label="2つの点の間に共通の言葉が並ぶ図">
          <circle cx="46" cy="100" r="26" fill="#ea580c"/>
          <circle cx="154" cy="100" r="26" fill="#7c3aed"/>
          <path d="M76 100 H124" stroke="#0e7490" stroke-width="2" stroke-dasharray="4 4"/>
          <rect x="56" y="34" width="88" height="26" rx="13" fill="#eefafd" stroke="#bfe5ef"/>
          <text x="100" y="51" fill="#0e7490" font-size="12" text-anchor="middle" font-family="sans-serif">キャンプ</text>
          <rect x="50" y="140" width="100" height="26" rx="13" fill="#eefafd" stroke="#bfe5ef"/>
          <text x="100" y="157" fill="#0e7490" font-size="12" text-anchor="middle" font-family="sans-serif">電子工作</text>
        </svg>
        <h2>近くにいる人ほど、<br>似た話をしている</h2>
        <p>タップすると、共通していることばが出ます。</p>
      </div>
      <div class="slide">
        <svg class="slide-art" viewBox="0 0 200 200" role="img" aria-label="文章から座標が決まる図">
          <rect x="24" y="50" width="152" height="46" rx="11" fill="#ffffff" stroke="#ded7cd"/>
          <path d="M40 68 H150 M40 81 H120" stroke="#c3bcb2" stroke-width="4" stroke-linecap="round"/>
          <path d="M100 102 V128" stroke="#ea580c" stroke-width="2"/>
          <path d="M94 120 L100 130 L106 120 Z" fill="#ea580c"/>
          <circle cx="100" cy="152" r="19" fill="#ea580c"/>
        </svg>
        <h2>名前はニックネームでいい</h2>
        <p>書くのは、やってきたこと・やってみたいこと。</p>
      </div>
    </div>
  </div>
  <div class="dots" id="dots"><i class="dot on"></i><i class="dot"></i><i class="dot"></i></div>
  <div class="nav-row">
    <button class="btn btn-quiet" id="backBtn" hidden>戻る</button>
    <button class="btn" id="nextBtn">次へ</button>
  </div>
</section>

<!-- ============ 2. profile ============ -->
<section id="profile" class="screen">
  <h2 class="screen-title">プロフィール</h2>

  <div class="scroller">
  <div class="field">
    <div class="label"><span>アイコン</span></div>
    <div class="icon-grid" id="iconGrid"></div>
  </div>

  <div class="field">
    <div class="label"><span>ユーザー名</span><span class="hint-text">16字まで</span></div>
    <input class="input" id="nameInput" maxlength="16" placeholder="ニックネーム" autocomplete="off">
  </div>

  <div class="field">
    <div class="label">
      <span>やってきたこと・やってみたいこと</span><span class="hint-text">30字以上</span>
    </div>
    <textarea class="textarea" id="textInput"
      placeholder="例）昔は吹奏楽でトランペット、今は在宅で経理をしています。いつか小さなパン屋をやってみたい。"></textarea>
  </div>
  </div>

  <div class="form-footer">
    <div class="footer-row">
      <div class="counter" id="counter">
        <svg class="ring" viewBox="0 0 24 24">
          <circle class="track" cx="12" cy="12" r="9"/>
          <circle class="value" cx="12" cy="12" r="9" stroke-dasharray="56.5" stroke-dashoffset="56.5"/>
        </svg>
        <span id="counterText">あと30字</span>
      </div>
      <div class="error" id="formError" role="alert"></div>
    </div>
    <button class="btn btn-block" id="submitBtn" disabled>地図にのせる</button>
  </div>
</section>

<!-- ============ 3. computing ============ -->
<section id="computing" class="screen">
  <div class="steps">
    <div class="step" data-step="0"><i class="step-dot"></i><span>ことばを取り出しています</span></div>
    <div class="step" data-step="1"><i class="step-dot"></i><span>近い人をさがしています</span></div>
    <div class="step" data-step="2"><i class="step-dot"></i><span>地図に置いています</span></div>
  </div>
</section>

<!-- ============ 4. reveal ============ -->
<section id="reveal" class="screen">
  <div class="reveal-head">
    <div class="reveal-title">あなたの島</div>
    <div class="reveal-island" id="revealIsland">—</div>
  </div>
  <div class="scroller" id="revealNeighbors"></div>
  <div class="form-footer">
    <button class="btn btn-block" id="toMapBtn">地図を見る</button>
  </div>
</section>

<!-- ============ 5. main ============ -->
<section id="main" class="screen">
  <canvas id="stage"></canvas>
  <div class="topbar">
    <div class="tabs" role="tablist">
      <button class="tab on" data-view="orbit" role="tab">まわりの人</button>
      <button class="tab" data-view="map" role="tab">全体マップ</button>
    </div>
    <div class="spacer"></div>
    <button class="icon-btn" id="meBtn"><span class="glyph">👤</span>自分</button>
    <a class="icon-btn" href="/how"><span class="glyph">?</span></a>
  </div>
  <div class="island-badge" id="islandBadge" hidden>
    <i class="island-swatch" id="islandSwatch"></i><span id="islandText"></span>
  </div>
</section>

<!-- ============ shared ============ -->
<div class="sheet-backdrop" id="sheetBackdrop"></div>
<div class="sheet" id="sheet" role="dialog" aria-modal="true">
  <button class="sheet-close" id="sheetClose" aria-label="閉じる">✕</button>
  <div class="sheet-grip"></div>
  <div id="sheetBody"></div>
</div>
<div class="toast" id="toast" role="status"></div>

<script type="module" src="/static/app.js"></script>
</body>
</html>
