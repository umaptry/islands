<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light">
<meta name="theme-color" content="#6d97dd">
<title>islands デモ版</title>
<link rel="stylesheet" href="/static/style.css">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='7' fill='%236d97dd'/><ellipse cx='12' cy='19' rx='8' ry='5' fill='%237cc47c'/><ellipse cx='22' cy='12' rx='6' ry='4' fill='%237cc47c'/></svg>">
</head>
<body>

<!-- ============ 0. booting ============
     Shown first so a returning visitor never sees the intro flash past while
     their profile is being fetched. app.js picks the real first screen. -->
<section id="booting" class="screen active">
  <div class="spinner" role="status" aria-label="読み込み中"></div>
</section>

<!-- ============ 1. intro ============ -->
<section id="intro" class="screen">
  <div class="brand">islands デモ版</div>
  <div class="slides">
    <div class="slide-track" id="slideTrack">
      <div class="slide">
        <svg class="slide-art" viewBox="0 0 200 200" role="img" aria-label="中心の点のまわりを他の点が囲む図">
          <g fill="none" stroke="rgba(255,255,255,.45)" stroke-dasharray="3 5">
            <circle cx="100" cy="100" r="42"/><circle cx="100" cy="100" r="66"/><circle cx="100" cy="100" r="90"/>
          </g>
          <ellipse cx="100" cy="100" rx="24" ry="17" fill="#7cc47c"/>
          <ellipse cx="141" cy="80" rx="13" ry="9" fill="#7cc47c"/>
          <ellipse cx="68" cy="142" rx="14" ry="10" fill="#7cc47c"/>
          <ellipse cx="44" cy="70" rx="11" ry="8" fill="#7cc47c"/>
          <ellipse cx="160" cy="142" rx="10" ry="7" fill="#7cc47c"/>
          <ellipse cx="100" cy="18" rx="9" ry="6" fill="#7cc47c"/>
        </svg>
        <h2>あなたが書いた一言で、<br>地図の上に島ができる</h2>
      </div>
      <div class="slide">
        <svg class="slide-art" viewBox="0 0 200 200" role="img" aria-label="2つの点の間に共通の言葉が並ぶ図">
          <ellipse cx="46" cy="100" rx="34" ry="24" fill="#7cc47c"/>
          <ellipse cx="154" cy="100" rx="34" ry="24" fill="#7cc47c"/>
          <path d="M84 100 H116" stroke="#fff" stroke-width="2" stroke-dasharray="4 4"/>
          <rect x="56" y="32" width="88" height="27" rx="13.5" fill="#fff"/>
          <text x="100" y="50" fill="#1f2c3b" font-size="12" text-anchor="middle" font-family="sans-serif">キャンプ</text>
          <rect x="50" y="141" width="100" height="27" rx="13.5" fill="#fff"/>
          <text x="100" y="159" fill="#1f2c3b" font-size="12" text-anchor="middle" font-family="sans-serif">電子工作</text>
        </svg>
        <h2>近くにいる人ほど、<br>似た話をしている</h2>
      </div>
      <div class="slide">
        <svg class="slide-art" viewBox="0 0 200 200" role="img" aria-label="いくつかの島の中に自分の島が立つ図">
          <ellipse cx="52" cy="52" rx="30" ry="20" fill="#7cc47c" opacity=".75"/>
          <ellipse cx="150" cy="44" rx="24" ry="16" fill="#7cc47c" opacity=".75"/>
          <ellipse cx="40" cy="150" rx="26" ry="17" fill="#7cc47c" opacity=".75"/>
          <ellipse cx="156" cy="152" rx="30" ry="20" fill="#7cc47c" opacity=".75"/>
          <ellipse cx="100" cy="108" rx="42" ry="27" fill="#7cc47c"/>
          <ellipse cx="100" cy="102" rx="27" ry="15" fill="#55a95c" opacity=".55"/>
          <path d="M100 44 a13 13 0 0 1 13 13 c0 10 -13 24 -13 24 s-13 -14 -13 -24 a13 13 0 0 1 13 -13 z" fill="#ff6f59"/>
          <circle cx="100" cy="57" r="5" fill="#fff"/>
        </svg>
        <h2>あなたの島をつくる。<br>似た島をさがす。</h2>
      </div>
    </div>
  </div>
  <div class="dots" id="dots"><i class="dot on"></i><i class="dot"></i><i class="dot"></i></div>
  <div class="nav-row">
    <button class="btn btn-quiet" id="backBtn" hidden>戻る</button>
    <button class="btn" id="nextBtn">次へ</button>
  </div>
</section>

<!-- ============ 2. profile ============ -->
<section id="profile" class="screen">
  <h2 class="screen-title">プロフィール</h2>

  <div class="scroller">
  <div class="field">
    <div class="label"><span>アイコン</span></div>
    <div class="icon-grid" id="iconGrid"></div>
  </div>

  <div class="field">
    <div class="label"><span>ユーザー名</span><span class="hint-text">16字まで</span></div>
    <input class="input" id="nameInput" maxlength="16" placeholder="ニックネーム" autocomplete="off">
  </div>

  <div class="field">
    <div class="label">
      <span>やってきたこと・やってみたいこと</span><span class="hint-text">30字以上</span>
    </div>
    <textarea class="textarea" id="textInput"
      placeholder="例）昔は吹奏楽でトランペット、今は在宅で経理をしています。いつか小さなパン屋をやってみたい。"></textarea>
  </div>
  </div>

  <div class="form-footer">
    <div class="footer-row">
      <div class="counter" id="counter">
        <svg class="ring" viewBox="0 0 24 24">
          <circle class="track" cx="12" cy="12" r="9"/>
          <circle class="value" cx="12" cy="12" r="9" stroke-dasharray="56.5" stroke-dashoffset="56.5"/>
        </svg>
        <span id="counterText">あと30字</span>
      </div>
      <div class="error" id="formError" role="alert"></div>
    </div>
    <div class="nav-row">
      <button class="btn btn-quiet" id="cancelBtn" hidden>やめる</button>
      <button class="btn" id="submitBtn" disabled>地図にのせる</button>
    </div>
  </div>
</section>

<!-- ============ 3. computing ============ -->
<section id="computing" class="screen">
  <div class="steps">
    <div class="step" data-step="0"><i class="step-dot"></i><span>ことばを取り出しています</span></div>
    <div class="step" data-step="1"><i class="step-dot"></i><span>近い人をさがしています</span></div>
    <div class="step" data-step="2"><i class="step-dot"></i><span>地図に置いています</span></div>
  </div>
</section>

<!-- ============ 4. reveal ============ -->
<section id="reveal" class="screen">
  <div class="reveal-head">
    <div class="reveal-title">あなたの島</div>
    <div class="reveal-island" id="revealIsland">—</div>
  </div>
  <div class="scroller" id="revealNeighbors"></div>
  <div class="form-footer">
    <button class="btn btn-block" id="toMapBtn">地図を見る</button>
  </div>
</section>

<!-- ============ 5. main ============ -->
<section id="main" class="screen">
  <canvas id="stage"></canvas>
  <div class="topbar">
    <div class="tabs" role="tablist">
      <button class="tab on" data-view="orbit" role="tab">まわりの人</button>
      <button class="tab" data-view="map" role="tab">全体マップ</button>
    </div>
    <div class="spacer"></div>
    <button class="icon-btn" id="addBtn" aria-label="投稿する"><span class="glyph">＋</span><span class="text">投稿</span></button>
    <button class="icon-btn" id="meBtn" aria-label="自分の投稿"><span class="glyph">👤</span><span class="text">自分</span></button>
  </div>
  <div class="island-badge" id="islandBadge" hidden>
    <i class="island-swatch" id="islandSwatch"></i><span id="islandText"></span>
  </div>
</section>

<!-- ============ shared ============ -->
<div class="sheet-backdrop" id="sheetBackdrop"></div>
<div class="sheet" id="sheet" role="dialog" aria-modal="true">
  <button class="sheet-close" id="sheetClose" aria-label="閉じる">✕</button>
  <div class="sheet-grip"></div>
  <div id="sheetBody"></div>
</div>
<div class="toast" id="toast" role="status"></div>

<script type="module" src="/static/app.js"></script>
</body>
</html>
